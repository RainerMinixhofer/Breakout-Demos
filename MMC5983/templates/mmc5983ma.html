<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMC5983MA Magnetometer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .canvas-container {
            flex: 1;
            min-height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .data-panel {
            width: 320px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .data-section {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .data-section h3 {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .data-row:last-child {
            margin-bottom: 0;
        }

        .data-label {
            color: #888;
            font-weight: 500;
        }

        .data-value {
            color: #333;
            font-weight: 600;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .component-bars {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .component-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .component-label {
            min-width: 20px;
            font-weight: 700;
            font-size: 12px;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
        }

        .component-label.x { background: #ff6b6b; }
        .component-label.y { background: #51cf66; }
        .component-label.z { background: #339af0; }

        .bar {
            flex: 1;
            height: 20px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s ease-out;
            border-radius: 4px;
        }

        .magnitude-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-left: none;
        }

        .magnitude-section h3 {
            color: rgba(255, 255, 255, 0.8);
        }

        .magnitude-value {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        .spherical-coords {
            font-size: 12px;
            text-align: center;
            opacity: 0.9;
            margin-top: 8px;
        }

        .status {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #51cf66;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 1200px) {
            .main-container {
                flex-direction: column;
            }

            .data-panel {
                width: 100%;
                max-width: 100%;
            }

            .canvas-container {
                min-height: 400px;
            }
        }

        @media (max-width: 600px) {
            .header {
                margin-bottom: 15px;
            }

            h1 {
                font-size: 22px;
            }

            .data-panel {
                padding: 18px;
            }

            .canvas-container {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧭 MMC5983MA Magnetometer</h1>
        <p class="subtitle">3D spherical magnetic field visualization</p>
    </div>

    <div class="main-container">
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <div class="data-panel">
            <div class="magnitude-section">
                <h3>Magnetic Field</h3>
                <div class="magnitude-value" id="magnitude">0.00</div>
                <div style="font-size: 12px; text-align: center;">Gauss</div>
                <div class="spherical-coords">
                    <div style="margin-top: 10px; font-size: 11px;">
                        θ: <span id="theta">0.0°</span><br/>
                        φ: <span id="phi">0.0°</span>
                    </div>
                </div>
                <div class="status connected">
                    <span class="status-indicator connected"></span>
                    <span id="status-text">Connected</span>
                </div>
            </div>

            <div class="data-section">
                <h3>Vector Components</h3>
                <div class="component-bars">
                    <div class="component-bar">
                        <div class="component-label x">X</div>
                        <div class="bar">
                            <div class="bar-fill" id="x-bar" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="component-bar">
                        <div class="component-label y">Y</div>
                        <div class="bar">
                            <div class="bar-fill" id="y-bar" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="component-bar">
                        <div class="component-label z">Z</div>
                        <div class="bar">
                            <div class="bar-fill" id="z-bar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="data-row" style="margin-top: 12px;">
                    <span class="data-label">X</span>
                    <span class="data-value" id="x-value">0.000000</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Y</span>
                    <span class="data-value" id="y-value">0.000000</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Z</span>
                    <span class="data-value" id="z-value">0.000000</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Three.js scene setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Create sphere (reference)
        const sphereGeometry = new THREE.SphereGeometry(1.5, 32, 32);
        const sphereMaterial = new THREE.MeshPhongMaterial({
            color: 0xe9ecef,
            wireframe: false,
            transparent: true,
            opacity: 0.2
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(sphere);

        // Create wireframe sphere
        const wireframeGeometry = new THREE.SphereGeometry(1.5, 16, 16);
        const wireframeMaterial = new THREE.LineBasicMaterial({
            color: 0xadb5bd,
            linewidth: 1,
            transparent: true,
            opacity: 0.3
        });
        const wireframe = new THREE.LineSegments(
            new THREE.WireframeGeometry(wireframeGeometry),
            wireframeMaterial
        );
        scene.add(wireframe);

        // Create coordinate axes
        const axesHelper = new THREE.AxesHelper(2);
        scene.add(axesHelper);

        // Create magnetic vector arrow
        const arrowGroup = new THREE.Group();
        scene.add(arrowGroup);

        function createArrow(direction, color) {
            const length = direction.length();
            if (length < 0.01) return null;

            direction.normalize();
            const arrowHelper = new THREE.ArrowHelper(
                direction,
                new THREE.Vector3(0, 0, 0),
                Math.min(length * 0.8, 1.8),
                color,
                0.3,
                0.2
            );
            return arrowHelper;
        }

        // Create points along the vector
        const pointGeometry = new THREE.BufferGeometry();
        const pointMaterial = new THREE.PointsMaterial({
            color: 0xff4757,
            size: 0.08,
            sizeAttenuation: true
        });
        const points = new THREE.Points(pointGeometry, pointMaterial);
        scene.add(points);

        // Data display elements
        const magnitudeEl = document.getElementById('magnitude');
        const thetaEl = document.getElementById('theta');
        const phiEl = document.getElementById('phi');
        const xValueEl = document.getElementById('x-value');
        const yValueEl = document.getElementById('y-value');
        const zValueEl = document.getElementById('z-value');
        const xBarEl = document.getElementById('x-bar');
        const yBarEl = document.getElementById('y-bar');
        const zBarEl = document.getElementById('z-bar');
        const statusIndicator = document.querySelector('.status-indicator');
        const statusText = document.getElementById('status-text');

        let maxMagnitude = 0.1;

        function updateSensorData() {
            fetch('/api/orientation')
                .then(response => {
                    if (response.ok) {
                        statusIndicator.classList.add('connected');
                        statusText.textContent = 'Connected';
                        return response.json();
                    }
                    throw new Error('Failed to fetch data');
                })
                .then(data => {
                    const x = data.x;
                    const y = data.y;
                    const z = data.z;

                    // Calculate magnitude
                    const magnitude = Math.sqrt(x * x + y * y + z * z);
                    maxMagnitude = Math.max(maxMagnitude, magnitude * 1.2);

                    // Calculate spherical coordinates
                    const theta = Math.atan2(Math.sqrt(x * x + y * y), z); // polar angle from +Z
                    const phi = Math.atan2(y, x); // azimuthal angle in X-Y plane

                    // Update display values
                    magnitudeEl.textContent = magnitude.toFixed(2);
                    thetaEl.textContent = (theta * 180 / Math.PI).toFixed(1) + '°';
                    phiEl.textContent = (phi * 180 / Math.PI).toFixed(1) + '°';
                    xValueEl.textContent = x.toFixed(6);
                    yValueEl.textContent = y.toFixed(6);
                    zValueEl.textContent = z.toFixed(6);

                    // Update bar widths (normalized by max magnitude)
                    const normX = Math.min(Math.abs(x) / maxMagnitude, 1);
                    const normY = Math.min(Math.abs(y) / maxMagnitude, 1);
                    const normZ = Math.min(Math.abs(z) / maxMagnitude, 1);

                    xBarEl.style.width = (normX * 100) + '%';
                    yBarEl.style.width = (normY * 100) + '%';
                    zBarEl.style.width = (normZ * 100) + '%';

                    // Update 3D visualization
                    arrowGroup.clear();
                    const direction = new THREE.Vector3(x, y, z);
                    const arrow = createArrow(direction, 0xff4757);
                    if (arrow) {
                        arrowGroup.add(arrow);
                    }

                    // Update point trail
                    if (magnitude > 0.01) {
                        const normalizedVec = direction.clone().normalize();
                        const pointPos = normalizedVec.multiplyScalar(Math.min(magnitude * 0.8, 1.8));

                        const positions = new Float32Array([
                            0, 0, 0,
                            pointPos.x, pointPos.y, pointPos.z
                        ]);
                        pointGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    }
                })
                .catch(error => {
                    console.error('Error updating sensor data:', error);
                    statusIndicator.classList.remove('connected');
                    statusText.textContent = 'Waiting...';
                });
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Slowly rotate the view
            camera.position.x = Math.sin(Date.now() * 0.0003) * 3.5;
            camera.position.z = Math.cos(Date.now() * 0.0003) * 3.5;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Update sensor data and start animation
        updateSensorData();
        setInterval(updateSensorData, 500);
        animate();
    </script>
</body>
</html>
