[env:rp2040zero]
platform = raspberrypi
; PlatformIO's raspberrypi platform does not ship a dedicated RP2040 Zero board ID.
; Use Raspberry Pi Pico (same RP2040 MCU + Arduino core support).
board = pico
framework = arduino
monitor_speed = 115200
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.140201.0
build_flags = -Wno-ignored-qualifiers
; You can set upload_port in this file if your board appears on a fixed device.
; upload_port = /dev/ttyACM0
