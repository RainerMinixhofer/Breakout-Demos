
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLX90640 Thermal Camera</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background: #111; color: #eee; }
    .wrap { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
    img { width: 100%; max-width: 960px; border: 1px solid #444; border-radius: 6px; background: #000; }
    .panel { background: #1b1b1b; padding: 12px; border-radius: 8px; border: 1px solid #333; }
    .row { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; font-size: 14px; color: #bbb; }
    input, select, button { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #555; background: #222; color: #eee; }
    .inline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stats { font-size: 14px; line-height: 1.5; margin-top: 10px; color: #ddd; }
    .ok { color: #91f291; }
    .err { color: #ff8e8e; }
  </style>
</head>
<body>
  <h2>MLX90640 Thermal Camera</h2>
  <div class="wrap">
    <div>
  <div class="panel" style="margin-bottom: 12px;">
    <img id="stream" src="/stream.mjpg" alt="Thermal stream">
  </div>
  <div class="panel">
    <div style="font-weight: bold; margin-bottom: 8px;">Integrated image</div>
    <img id="integratedStream" src="/integrated.jpg" alt="Integrated thermal image" style="max-height: 320px; object-fit: contain;">
  </div>
    </div>
    <div class="panel">
  <div class="row">
    <label for="refresh">Refresh rate</label>
        <select id="refresh">
          <option value="0">0.5 Hz (code 0)</option>
          <option value="1">1 Hz (code 1)</option>
          <option value="2">2 Hz (code 2)</option>
          <option value="3">4 Hz (code 3)</option>
          <option value="4" selected>8 Hz (code 4)</option>
          <option value="5">16 Hz (code 5)</option>
          <option value="6">32 Hz (code 6)</option>
          <option value="7">64 Hz (code 7)</option>
        </select>
      </div>
      <div class="row">
        <label for="averageFrames">Average frames</label>
        <input id="averageFrames" type="number" min="1" max="32" step="1" value="1">
      </div>
      <div class="row">
        <label for="integrationTime">Integration time (s, max 30)</label>
        <input id="integrationTime" type="number" min="0" max="30" step="0.1" value="1.0">
      </div>
      <div class="row inline">
        <div>
          <label for="sensorResolution">Resolution</label>
          <select id="sensorResolution">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
        <div>
          <label for="sensorMode">Mode</label>
          <select id="sensorMode">
            <option value="chess" selected>chess</option>
            <option value="interleaved">interleaved</option>
          </select>
        </div>
      </div>
      <div class="row">
        <label><input id="stripeCorrectionEnabled" type="checkbox"> Stripe correction</label>
      </div>
      <div class="row">
        <label for="stripeCorrectionStrength">Stripe correction strength</label>
        <input id="stripeCorrectionStrength" type="number" min="0.0" max="1.0" step="0.05" value="1.0">
      </div>
      <div class="row">
        <label><input id="medianFilterEnabled" type="checkbox"> Median filter</label>
      </div>
      <div class="row">
        <label for="medianKernel">Median kernel size</label>
        <select id="medianKernel">
          <option value="3" selected>3x3</option>
          <option value="5">5x5</option>
          <option value="7">7x7</option>
        </select>
      </div>
      <div class="row inline">
        <div>
          <label for="emissivity">Emissivity</label>
          <input id="emissivity" type="number" min="0.1" max="1.0" step="0.01" value="1.0">
        </div>
        <div>
          <label for="trOffset">Tr offset (°C)</label>
          <input id="trOffset" type="number" min="-40" max="40" step="0.1" value="8.0">
        </div>
      </div>
      <div class="row inline">
        <div>
          <label for="palette">Palette</label>
          <select id="palette">
            <option value="inferno" selected>inferno</option>
            <option value="turbo">turbo</option>
            <option value="jet">jet</option>
            <option value="hot">hot</option>
            <option value="plasma">plasma</option>
          </select>
        </div>
        <div>
          <label for="interpolation">Interpolation</label>
          <select id="interpolation">
            <option value="nearest" selected>nearest</option>
            <option value="linear">linear</option>
          </select>
        </div>
      </div>
      <div class="row">
        <label><input id="displayEnhancementEnabled" type="checkbox" checked> Display enhancement (Lanczos + mild sharpening)</label>
      </div>
      <div class="row">
        <label><input id="autoScale" type="checkbox" checked> Auto scale</label>
      </div>
      <div class="row inline">
        <div>
          <label for="minTemp">Min temp (°C)</label>
          <input id="minTemp" type="number" step="0.1" value="20.0">
        </div>
        <div>
          <label for="maxTemp">Max temp (°C)</label>
          <input id="maxTemp" type="number" step="0.1" value="35.0">
        </div>
      </div>
      <div class="row">
        <button id="mitigationPresetBtn">Apply stripe-mitigation preset</button>
      </div>
      <details id="statusDetails" class="panel" style="margin-top: 12px; padding: 12px;">
        <summary style="cursor: pointer; font-weight: bold;">Additional status registers</summary>
        <div id="registerStatus" class="stats" style="margin-top: 8px;"></div>
      </details>
      <div id="status" class="stats" style="margin-top: 12px;"></div>
    </div>
  </div>
<script>
async function getState() {
  const details = document.getElementById('statusDetails');
  const includeStatusRegisters = !!(details && details.open);
  const url = includeStatusRegisters ? '/api/state?include_status_registers=true' : '/api/state';
  const r = await fetch(url);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'state read failed');
  return data;
}

const FORM_FIELDS = [
  'refresh',
  'averageFrames',
  'integrationTime',
  'sensorResolution',
  'sensorMode',
  'stripeCorrectionEnabled',
  'stripeCorrectionStrength',
  'medianFilterEnabled',
  'medianKernel',
  'emissivity',
  'trOffset',
  'palette',
  'interpolation',
  'displayEnhancementEnabled',
  'autoScale',
  'minTemp',
  'maxTemp',
];
const CONTROL_APPLY_DEBOUNCE_MS = 120;
let autoApplyTimer = null;

function backendStateToFormState(s) {
  return {
    refresh: String(s.refresh_rate_code),
    averageFrames: String(s.average_frames),
    integrationTime: Number(s.integration_time_seconds).toFixed(1),
    sensorResolution: String(s.sensor_resolution ?? 0),
    sensorMode: String(s.sensor_mode ?? 'chess'),
    stripeCorrectionEnabled: Boolean(s.stripe_correction_enabled),
    stripeCorrectionStrength: Number(s.stripe_correction_strength).toFixed(2),
    medianFilterEnabled: Boolean(s.median_filter_enabled),
    medianKernel: String(s.median_kernel),
    emissivity: Number(s.emissivity).toFixed(2),
    trOffset: Number(s.tr_offset).toFixed(1),
    palette: s.palette,
    interpolation: s.interpolation,
    displayEnhancementEnabled: Boolean(s.display_enhancement_enabled),
    autoScale: Boolean(s.auto_scale),
    minTemp: Number(s.min_temp).toFixed(1),
    maxTemp: Number(s.max_temp).toFixed(1),
  };
}

function readFormState() {
  return {
    refresh: document.getElementById('refresh').value,
    averageFrames: document.getElementById('averageFrames').value,
    integrationTime: document.getElementById('integrationTime').value,
    sensorResolution: document.getElementById('sensorResolution').value,
    sensorMode: document.getElementById('sensorMode').value,
    stripeCorrectionEnabled: document.getElementById('stripeCorrectionEnabled').checked,
    stripeCorrectionStrength: document.getElementById('stripeCorrectionStrength').value,
    medianFilterEnabled: document.getElementById('medianFilterEnabled').checked,
    medianKernel: document.getElementById('medianKernel').value,
    emissivity: document.getElementById('emissivity').value,
    trOffset: document.getElementById('trOffset').value,
    palette: document.getElementById('palette').value,
    interpolation: document.getElementById('interpolation').value,
    displayEnhancementEnabled: document.getElementById('displayEnhancementEnabled').checked,
    autoScale: document.getElementById('autoScale').checked,
    minTemp: document.getElementById('minTemp').value,
    maxTemp: document.getElementById('maxTemp').value,
  };
}

function applyFormState(state) {
  if (state.refresh !== undefined) document.getElementById('refresh').value = String(state.refresh);
  if (state.averageFrames !== undefined) document.getElementById('averageFrames').value = String(state.averageFrames);
  if (state.integrationTime !== undefined) document.getElementById('integrationTime').value = String(state.integrationTime);
  if (state.sensorResolution !== undefined) document.getElementById('sensorResolution').value = String(state.sensorResolution);
  if (state.sensorMode !== undefined) document.getElementById('sensorMode').value = String(state.sensorMode);
  if (state.stripeCorrectionEnabled !== undefined) document.getElementById('stripeCorrectionEnabled').checked = Boolean(state.stripeCorrectionEnabled);
  if (state.stripeCorrectionStrength !== undefined) document.getElementById('stripeCorrectionStrength').value = String(state.stripeCorrectionStrength);
  if (state.medianFilterEnabled !== undefined) document.getElementById('medianFilterEnabled').checked = Boolean(state.medianFilterEnabled);
  if (state.medianKernel !== undefined) document.getElementById('medianKernel').value = String(state.medianKernel);
  if (state.emissivity !== undefined) document.getElementById('emissivity').value = String(state.emissivity);
  if (state.trOffset !== undefined) document.getElementById('trOffset').value = String(state.trOffset);
  if (state.palette !== undefined) document.getElementById('palette').value = String(state.palette);
  if (state.interpolation !== undefined) document.getElementById('interpolation').value = String(state.interpolation);
  if (state.displayEnhancementEnabled !== undefined) document.getElementById('displayEnhancementEnabled').checked = Boolean(state.displayEnhancementEnabled);
  if (state.autoScale !== undefined) document.getElementById('autoScale').checked = Boolean(state.autoScale);
  if (state.minTemp !== undefined) document.getElementById('minTemp').value = String(state.minTemp);
  if (state.maxTemp !== undefined) document.getElementById('maxTemp').value = String(state.maxTemp);
}

function updateFormFromBackend(s) {
  applyFormState(backendStateToFormState(s));
}

function updateRegisterStatus(s) {
  const details = document.getElementById('statusDetails');
  if (!details || !details.open) {
    document.getElementById('registerStatus').innerHTML = '';
    return;
  }

  const regs = s.status_registers || {};
  const registerInfo = {
    'Sub-page': 'Current sub-frame/page index used by the sensor readout logic. Rapid or repeated changes can indicate a readout/timing issue.',
    'VDD': 'Internal VDD estimation derived from the sensor calibration path.',
    'Ambient TA': 'Ambient temperature measurement used to compute the thermal scene values.',
    'Frame data words': 'Raw 16-bit words from the most recent frame buffer; useful for diagnosing readout issues or calibration errors.',
    'EEPROM words': 'Raw EEPROM calibration words; useful for verifying calibration loads and diagnosing fixed-pattern artifacts.',
  };

  const registerHtml = [
    ['Sub-page', Number(regs.sub_page ?? 0)],
    ['VDD', `${Number(regs.vdd ?? 0).toFixed(3)} V`],
    ['Ambient TA', `${Number(regs.ta ?? 0).toFixed(2)} °C`],
    ['Frame data words', Array.isArray(regs.frame_data_words) ? regs.frame_data_words.slice(0, 12).join(', ') : 'n/a'],
    ['EEPROM words', Array.isArray(regs.eeprom_words) ? regs.eeprom_words.slice(0, 12).join(', ') : 'n/a'],
  ].map(([label, value]) => `<div title="${registerInfo[label] || 'MLX90640 status value'}"><strong>${label}:</strong> ${value}</div>`).join('');

  const subPage = Number(regs.sub_page ?? 0);
  const subPageWarning = subPage === 0 && s.last_error === null ? '' : '<div class="err">Sub-page stability warning: the page index is changing or being read inconsistently.</div>';
  document.getElementById('registerStatus').innerHTML = `${subPageWarning}${registerHtml}`;
}

function renderStatus(s) {
  const err = s.last_error ? `<div class="err">Error: ${s.last_error}</div>` : '<div class="ok">Camera running</div>';
  const st = s.stats || {};
  document.getElementById('status').innerHTML =
    `${err}
    <div>Configured: code ${s.refresh_rate_code} (${s.refresh_rate_hz} Hz)</div>
    <div>Averaging: ${s.average_frames} frame(s)</div>
    <div>Stripe correction: ${s.stripe_correction_enabled ? 'on' : 'off'} (${Number(s.stripe_correction_strength).toFixed(2)})</div>
    <div>Median filter: ${s.median_filter_enabled ? 'on' : 'off'} (${s.median_kernel}x${s.median_kernel})</div>
    <div>Frame min/max/mean: ${Number(st.min ?? 0).toFixed(1)} / ${Number(st.max ?? 0).toFixed(1)} / ${Number(st.mean ?? 0).toFixed(1)} °C</div>
    <div>Stream FPS: ${Number(st.fps ?? 0).toFixed(2)}</div>`;

  updateRegisterStatus(s);
}

async function applyControls() {
  const payload = {
    refresh_rate_code: Number(document.getElementById('refresh').value),
    average_frames: Number(document.getElementById('averageFrames').value),
    integration_time_seconds: Number(document.getElementById('integrationTime').value),
    sensor_resolution: Number(document.getElementById('sensorResolution').value),
    sensor_mode: document.getElementById('sensorMode').value,
    stripe_correction_enabled: document.getElementById('stripeCorrectionEnabled').checked,
    stripe_correction_strength: Number(document.getElementById('stripeCorrectionStrength').value),
    median_filter_enabled: document.getElementById('medianFilterEnabled').checked,
    median_kernel: Number(document.getElementById('medianKernel').value),
    emissivity: Number(document.getElementById('emissivity').value),
    tr_offset: Number(document.getElementById('trOffset').value),
    palette: document.getElementById('palette').value,
    interpolation: document.getElementById('interpolation').value,
    display_enhancement_enabled: document.getElementById('displayEnhancementEnabled').checked,
    auto_scale: document.getElementById('autoScale').checked,
    min_temp: Number(document.getElementById('minTemp').value),
    max_temp: Number(document.getElementById('maxTemp').value),
  };
  const r = await fetch('/api/control', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await r.json();
  if (!r.ok) {
    document.getElementById('status').innerHTML = `<div class="err">Apply failed: ${data.error}</div>`;
    return;
  }
  updateFormFromBackend(data);
  renderStatus(data);
}

function scheduleAutoApply() {
  if (autoApplyTimer) {
    clearTimeout(autoApplyTimer);
  }
  autoApplyTimer = setTimeout(() => {
    applyControls().catch((err) => {
      document.getElementById('status').innerHTML = `<div class="err">Apply failed: ${err.message}</div>`;
    });
  }, CONTROL_APPLY_DEBOUNCE_MS);
}

document.getElementById('mitigationPresetBtn').addEventListener('click', () => {
  applyFormState({
    averageFrames: '16',
    stripeCorrectionEnabled: true,
    stripeCorrectionStrength: '0.85',
    medianFilterEnabled: true,
    medianKernel: '5',
  });
  scheduleAutoApply();
});
FORM_FIELDS.forEach((fieldId) => {
  const eventName = (fieldId === 'autoScale' || fieldId === 'stripeCorrectionEnabled' || fieldId === 'medianFilterEnabled')
    ? 'change'
    : 'input';
  document.getElementById(fieldId).addEventListener(eventName, scheduleAutoApply);
});

async function refreshState() {
  try {
    const s = await getState();
    updateFormFromBackend(s);
    renderStatus(s);
  } catch (e) {
    document.getElementById('status').innerHTML = `<div class="err">${e.message}</div>`;
  }
}

document.getElementById('statusDetails').addEventListener('toggle', () => {
  refreshState();
});

function refreshIntegratedFrame() {
  const img = document.getElementById('integratedStream');
  if (img) {
    img.src = `/integrated.jpg?ts=${Date.now()}`;
  }
}

refreshState();
refreshIntegratedFrame();
setInterval(refreshState, 1000);
setInterval(refreshIntegratedFrame, 500);
</script>
</body>
</html>
